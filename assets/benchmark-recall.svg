<svg xmlns="http://www.w3.org/2000/svg" width="720" height="136" viewBox="0 0 720 136" role="img" aria-label="Project-context fact recall: bare agent 8% (4 of 51 facts), with AI OS Wiki 84% (43 of 51 facts). 8 questions, 3 runs per arm, Haiku.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #24292f; }
    .sub { font-size: 12px; fill: #57606a; }
    .label { font-size: 13px; fill: #57606a; }
    .value { font-size: 13px; font-weight: 600; fill: #24292f; }
    .track { fill: #8b949e; fill-opacity: 0.16; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #c9d1d9; }
      .sub, .label { fill: #8b949e; }
      .value { fill: #c9d1d9; }
    }
  </style>
  <text x="10" y="22" class="title">Project-context fact recall</text>
  <text x="710" y="22" text-anchor="end" class="sub">8 questions × 3 runs per arm · claude -p, Haiku</text>

  <!-- bare agent: 8% of 520px = 41.6 -->
  <text x="160" y="66" text-anchor="end" class="label">bare agent</text>
  <rect x="170" y="49" width="520" height="26" rx="4" class="track"/>
  <path d="M170,49 h37.6 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-37.6 z" fill="#3b82f6"/>
  <text x="220" y="66" class="value">8% (4/51 facts)</text>

  <!-- with AI OS Wiki: 84% of 520px = 436.8 -->
  <text x="160" y="106" text-anchor="end" class="label">with AI OS Wiki</text>
  <rect x="170" y="89" width="520" height="26" rx="4" class="track"/>
  <path d="M170,89 h432.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-432.8 z" fill="#15803d"/>
  <text x="615" y="106" class="value">84% (43/51 facts)</text>
</svg>
