description = "Connect the current project to the Obsidian AI OS Wiki"
prompt = "Connect this project to AI OS Wiki. First ensure the working directory is the actual project folder, never the home directory. Prefer `ai-os setup`; if unavailable use `npx github:littleduck1219/ai-os-wiki-cli setup`. Do not overwrite team-owned AGENTS.md, CLAUDE.md, or CODEX.md; use `.ai-os/CODEX.md` when team files already exist. After connection, verify Project Root, Active Context, Runbook, Session Brief, Decision Log, Work Records, Follow-ups, and Issue Map exist. Treat Runbook as the project operation guide: for executable software, populate install/run/build/test/service details from real files; for documentation, portfolio, server-build, or knowledge projects, record the writing/publishing/operating workflow instead of writing that no run method exists. Do not overwrite existing human-written Runbook content unless the user asks for a refresh. Use the filename icon hierarchy exactly: 📒 project root; 📕 hubs/indexes; 📗 operational/rule/protocol/template/mid-level docs; 📘 actual leaf records such as work record entries, issue record entries, follow-up entries, and deep detail notes. Never create AI OS Wiki notes with 📄."
